<!-- Speak With Someone: the lightweight route on every page. Same pipeline as the introduction line, pathway "introduce". -->
<section id="s-speak" class="rv" data-g="#F1E9D6">
  <div class="wrap">
    <div class="after-lines" style="margin-top:0;">
      <div class="line fade">
        <div class="ltxt">Speak with someone. Ethan's office replies within one business day.</div>
        <div class="lform">
          <form id="speakform" class="mini" novalidate>
            <input id="sp1" placeholder="Your name" aria-label="Your name" autocomplete="name">
            <input id="sp2" type="email" placeholder="Your email" aria-label="Your email" autocomplete="email">
            <input id="sp3" placeholder="Your organization" aria-label="Your organization" autocomplete="organization">
            <input id="sp4" placeholder="What you have in mind" aria-label="What you have in mind, in a sentence">
            <button type="submit" class="dl-btn">Speak with someone</button>
          </form>
          <div class="mini-done" hidden>Received. Ethan's office will be in touch.</div>
        </div>
      </div>
    </div>
  </div>
</section>
